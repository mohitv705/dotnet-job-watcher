# ============================================================
# GLOBAL FILTERS
# ============================================================

filters:
  remote_only: false

  locations: []

  keywords_include: []

  # Keep these out because they are generally above your
  # current ~3-year experience target.
  keywords_exclude:
    - Staff
    - Principal
    - Manager
    - Intern

  # Experience is intentionally NOT hard-filtered.
  # The watcher extracts it and displays the match level
  # in Telegram instead.
  experience_levels: []

